name: Release

# Only version-like tags trigger a release ("1.2.3", "1.2.3b1", "v1.2.3"...), so a
# tag ruleset on the same patterns can restrict who may create them. Other tags
# are ignored.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag and build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    outputs:
      version: ${{ steps.validate.outputs.version }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install tooling
        run: python -m pip install --upgrade pip build twine packaging

      # Fail before any PyPI upload: the github-release job could not create it.
      - name: Check that the tag has no GitHub release yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already has a GitHub release; publication cancelled."
            exit 1
          fi

      - name: Build distributions
        run: |
          rm -rf dist build src/*.egg-info
          python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      # The built files are named after the normalized __version__. The tag is
      # normalized the same way (PEP 440), so "1.2.3beta1", "1.2.3-beta.1" and
      # "v1.2.3b1" all match a 1.2.3b1 build.
      - name: Check that the tag matches the built version
        id: validate
        run: |
          parsed=$(python -c 'import sys; from packaging.version import Version; v = Version(sys.argv[1]); print(v, str(v.is_prerelease).lower())' "$RELEASE_TAG") \
            || { echo "::error::Tag $RELEASE_TAG is not a valid PEP 440 version."; exit 1; }
          read -r version prerelease <<< "$parsed"
          if ! ls dist/vtherm_api-"$version"-*.whl dist/vtherm_api-"$version".tar.gz >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG (version $version) does not match the built version: $(ls dist | tr '\n' ' ')"
            exit 1
          fi
          echo "Version $version, pre-release: $prerelease"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  pypi:
    name: Publish to PyPI
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1 # release/v1
        with:
          packages-dir: dist/
          verbose: true

  github-release:
    name: Create GitHub release
    needs: [validate, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      # Notes are generated by GitHub: merged pull requests since the previous release.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          args=(--title "vtherm_api $VERSION" --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}"
